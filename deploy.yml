name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site com a chave da TomTom
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: |
          test -n "$TOMTOM_KEY" || { echo "Falta o segredo TOMTOM_KEY (Settings > Secrets and variables > Actions)"; exit 1; }
          mkdir _site
          cp index.html _site/
          printf 'window.TT_KEY = "%s";\n' "$TOMTOM_KEY" > _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
